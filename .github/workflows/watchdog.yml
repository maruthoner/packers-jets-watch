# The seat watch is one long-lived job, so anything that kills it (on Sep 18 the GitHub
# runner itself died mid-window: the step stayed "in progress" and its logs were lost)
# stops every check until the throttled schedule fires again — that gap was 110 minutes.
# This restarts the watcher within a minute, and speaks up if restarting is not working.
name: Seat watch watchdog

on:
  workflow_run:
    workflows: ['Seat watch']
    types: [completed]

permissions:
  actions: write
  issues: write

jobs:
  restart:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    steps:
      - name: Restart the watcher, unless it keeps dying
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          DEAD_RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          SINCE=$(date -u -d '90 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          BAD=$(gh run list --workflow watch.yml --repo "$REPO" --limit 30 \
                  --json createdAt,conclusion \
                  --jq "[.[] | select(.createdAt > \"$SINCE\") | select(.conclusion == \"failure\" or .conclusion == \"timed_out\")] | length")
          echo "seat watch runs that died in the last 90 minutes: $BAD"

          if [ "$BAD" -ge 4 ]; then
            TITLE="Seat watch: the run keeps stopping"
            BODY="@$OWNER — the seat watch run has stopped unexpectedly $BAD times in the last 90 minutes, so restarting it is not working. Seat checks are not running. Latest dead run: $DEAD_RUN"
            NUM=$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE\"" --json number,title \
                    --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
            if [ -n "$NUM" ]; then
              gh issue comment "$NUM" --repo "$REPO" --body "$BODY"
            else
              gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" --assignee "$OWNER"
            fi
            exit 0
          fi

          echo "restarting the seat watch after $DEAD_RUN"
          gh workflow run watch.yml --repo "$REPO" --ref main
