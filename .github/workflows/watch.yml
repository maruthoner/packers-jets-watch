name: Seat watch

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: seat-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Configure git
        run: |
          git config user.name "seat-watch"
          git config user.email "noreply@github.com"

      # GitHub's scheduler throttles */30 badly — observed ~1 run per 5 hours.
      # So one run stays alive and checks on its own clock instead.
      - name: Watch loop
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          END=$(( $(date +%s) + 19200 ))   # stop after 5h20m, inside the 340-min job cap
          N=0
          while :; do
            N=$((N+1))
            echo "::group::cycle $N — $(date -u '+%H:%M UTC')"
            ./cycle.sh
            echo "::endgroup::"
            NOW=$(date +%s)
            [ "$NOW" -ge "$END" ] && { echo "window complete after $N cycles"; break; }
            REMAIN=$(( END - NOW ))
            [ "$REMAIN" -lt 1800 ] && { echo "less than one cycle left; stopping after $N"; break; }
            sleep 1800
          done
