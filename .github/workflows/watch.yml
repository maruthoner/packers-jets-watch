name: Seat watch

on:
  schedule:
    - cron: '7 * * * *'   # cold start only; the runs chain themselves (see below)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'One cycle per game: no issues, no publishing'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write   # each run queues the next one

concurrency:
  group: seat-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # one check plus its pause; a dead runner shows up within this
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # publishing replays files onto the remote; that needs real history

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Any games left to watch?
        id: games
        run: node -e "import('./watchers.mjs').then(m=>console.log('active='+Object.values(m.WATCHERS).filter(w=>Date.now()<Date.parse(w.kickoff)).length))" >> "$GITHUB_OUTPUT"

      - if: steps.games.outputs.active != '0'
        run: npm ci

      - if: steps.games.outputs.active != '0'
        name: Tests must pass before anything is checked or published
        run: npm test

      - if: steps.games.outputs.active != '0'
        run: npx playwright install --with-deps chromium

      - if: steps.games.outputs.active != '0'
        name: Configure git
        run: |
          git config user.name "seat-watch"
          git config user.email "noreply@github.com"

      # One check per run, then hand over.
      #
      # This used to be a single job looping for 5h30m. When its runner hung — Sep 18
      # and twice on Sep 21 — the job sat "in progress" past its own timeout holding
      # the concurrency group, and checks stopped for hours. Nothing noticed quickly:
      # watchdog.yml only sees a run that FAILS, and GitHub throttles the cron watchdog
      # to roughly one run every five hours whatever schedule it asks for.
      #
      # So each run now does exactly one check and exits, and the job's own 30-minute
      # timeout is what catches a dead runner. The successor is queued BEFORE the check
      # runs, so one is already waiting even if this runner dies mid-check; concurrency
      # holds it until this run ends.
      - if: steps.games.outputs.active != '0'
        name: One check, then hand over
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          START=$(date +%s)
          INTERVAL=1200   # 20 minutes between checks (Ruth, Sep 22)

          if [ "$DRY_RUN" != "1" ]; then
            gh workflow run watch.yml --repo "$REPO" --ref main \
              || echo "could not queue the next run — the watchdog will pick this up"
          fi

          if node cycle.mjs; then RC=0; else RC=$?; fi
          echo "cycle exited $RC"

          # 3 means every game has been played. The successor already queued will find
          # the same and stop at the "Any games left" step, so the chain ends there.
          [ "$RC" -eq 3 ] && { echo "no games left to watch"; exit 0; }
          [ "$DRY_RUN" = "1" ] && { echo "dry run: one cycle only"; exit 0; }

          # Hold the slot so checks land every 20 minutes rather than back to back.
          # A failed cycle waits too: without this a persistent failure would spin.
          SLEEP=$(( INTERVAL - ($(date +%s) - START) ))
          if [ "$SLEEP" -gt 0 ]; then
            echo "next check in ${SLEEP}s; the queued run takes over when this one ends"
            sleep "$SLEEP"
          fi
